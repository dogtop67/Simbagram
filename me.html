<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акаунт</title>
  <link rel="stylesheet" href="style_me.css">
</head>
<body>

    <div class="header">
        <a href="home.html" class="button">←</a>
        <div class="logo-container">
            <div class="logo-title">Simtea</div>
        </div>
        <div style="width: 140px;" class="desktop-spacer"></div>
    </div>

            <div class="stats-box">
                <div class="stat-item">
                    <span>Підписники :</span>
                    <span class="stat-val">2</span>
                </div>
                <div class="stat-item">
                    <span>Ви підписані :</span>
                    <span class="stat-val">1</span>
                </div>
                <div class="stat-item">
                    <span>Нових Сповіщень :</span>
                    <span class="stat-val">0</span>
                </div>
            </div>
        </div>

        <div class="profile-content">
            <div>
                <div class="section-title">Підписники</div>
                <div class="games-list">
                    <div class="game-item">
                        <div class="game-info">
                            <div class="game-name">Мурка666</div>
                            <div class="game-meta">Не в мережі</div>
                        </div>
                        <button class="play-btn">Переглянути акаунт</button>
                    </div>
                    <div class="game-item">
                        <div class="game-info">
                            <div class="game-name">Кицюня52</div>

                        </div>
                        <button class="play-btn">Переглянути акаунт</button>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
